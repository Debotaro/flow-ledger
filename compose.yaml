services:
  api:
    build: .
    ports: ["127.0.0.1:8012:8012"]
    environment:
      FLOW_API_TOKEN: ${FLOW_API_TOKEN:?Set a random workspace token of at least24characters}
      FLOW_HOSTS: localhost,127.0.0.1
    volumes: ["flow-data:/app/data"]
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "flowledger.worker"]
    healthcheck:
      disable: true # The worker has no HTTP listener; inspect polling progress through the API.
    environment:
      FLOW_DEMO_MODE: '0'
    volumes: ["flow-data:/app/data"]
    restart: unless-stopped
volumes:
  flow-data:
