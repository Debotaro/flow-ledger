[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flowledger"
version = "1.0.0"
description = "Durable support workflows with approvals, fenced leases and local effect reconciliation"
requires-python = ">=3.12"
dependencies = ["fastapi==0.143.2", "uvicorn==0.54.0"]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.17.1"]

[tool.setuptools.package-data]
flowledger = ["static/*", "fixtures/*.json"]

[tool.setuptools.packages.find]
include = ["flowledger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
